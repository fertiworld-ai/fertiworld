<style>
:root{--bg:#f5f9f8;--card:#fff;--ink:#16302b;--mute:#5d7570;--brand:#0f766e;--soft:#d8efeb;--line:#d5e3e0;--warn:#fff4dc;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1a18;--card:#162623;--ink:#e6f2ef;--mute:#9bb5b0;--brand:#2dd4bf;--soft:#173b36;--line:#27413d;--warn:#3a3016}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0 auto;background:var(--bg);color:var(--ink);font-family:system-ui,"Noto Sans Devanagari","Noto Sans Arabic",sans-serif;line-height:1.55;max-width:480px;padding-bottom:84px}
header{padding:18px 18px 6px}
h1{font-size:22px;margin:0}
.sub{color:var(--mute);font-size:14px;margin:2px 0 0}
section{display:none;padding:8px 18px}
section.on{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 0}
.card h3{margin:0 0 4px;font-size:16px}
.card p{margin:0;font-size:14px;color:var(--mute)}
button{font:inherit;background:var(--brand);color:#fff;border:0;border-radius:10px;padding:10px 14px;margin-top:10px;cursor:pointer}
button.alt{background:var(--soft);color:var(--ink)}
.note{background:var(--warn);border-radius:10px;padding:10px 12px;font-size:13px;margin:10px 0}
nav{position:fixed;bottom:0;left:0;right:0;max-width:480px;margin:0 auto;display:flex;background:var(--card);border-top:1px solid var(--line);padding:6px 0 calc(6px + env(safe-area-inset-bottom,0px))}
nav button{flex:1;background:none;color:var(--mute);margin:0;padding:8px 2px;font-size:12px;border-radius:0}
nav button.on{color:var(--brand);font-weight:700}
input,select{font:inherit;width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);margin-top:6px}
.lang{margin-top:10px}
.res{margin-top:10px;font-size:14px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
details{border-top:1px solid var(--line);padding:8px 0}summary{cursor:pointer;font-weight:600;font-size:15px}details p{margin:6px 0 0}
</style>

<script>

en:{loc:'en-US',mph:"Find fertility care (demo)",mpp:"Search sample hospitals, doctors and labs on a map.",mpt:"Find fertility care",mpn:"Sample locations only. These are not real hospitals or doctors.",mps:"Search by city or name",mpa:"All",mp1:"IVF centres",mp2:"Hospitals",mp3:"Doctors",mp4:"Labs",mpd:"Directions",mpv:"Sample · not verified",mpe:"The map needs an internet connection to load.",lrh:"Glossary and healthy habits",lrp:"Simple definitions and everyday tips.",lrt:"Glossary",lrt2:"Healthy habits",g1:"IVF: eggs and sperm are combined in a lab and the embryo is placed in the womb.",g2:"IUI: prepared sperm is placed in the womb around ovulation.",g3:"ICSI: one sperm is injected into an egg in the lab. It is one method used in IVF.",g4:"AMH: a hormone linked to the number of eggs remaining (ovarian reserve). Understand it with your doctor.",g5:"FSH: a hormone from the brain that helps eggs grow. It is often tested on a specific day of the cycle.",g6:"PCOS: a hormonal condition that can cause irregular periods and ovulation problems.",g7:"Endometriosis: tissue like the womb lining grows outside the womb and can cause pain and fertility problems.",g8:"Motility: how well sperm move.",g9:"Morphology: the shape of sperm.",g10:"Ovulation: release of an egg from the ovary.",g11:"Embryo: the early stage of development after fertilization.",h1:"Avoid tobacco in any form.",h2:"Limit alcohol.",h3:"Aim for a healthy weight and regular activity.",h4:"Look after stress and sleep.",h5:"Ask your doctor before taking any supplement (including folic acid) or medicine.",h6:"Avoid unproven treatments and sellers who promise guaranteed results.",fc1q:"PCOS",fc1a:"Can cause irregular periods and ovulation problems. Diagnosis needs a doctor, and treatment depends on your goals.",fc2q:"Endometriosis",fc2a:"Can cause pelvic pain and may affect fertility. See a doctor if you have severe period pain.",fc3q:"Thyroid",fc3a:"Thyroid problems can affect periods and fertility. A simple blood test ordered by your doctor can check it.",shr:"Share app",shrt:"Fertility information in plain language",trm:"Terms",hwh:"How it works and FAQ",hwp:"What the app does, and answers to common questions.",hwt:"How it works",hw1:"1. Learn: read the simple guides on male health, female health and IVF.",hw2:"2. Understand: enter report values and get a plain-language explanation.",hw3:"3. Talk to your doctor: use the questions we suggest. Your doctor decides what is right for you.",hwxt:"What this app does not do",hwx:"It does not diagnose, prescribe or give treatment advice. It is not for emergencies. In this demo, please never enter real medical data.",qat:"Common questions",qa1q:"Can this app tell me if I can have a baby?",qa1a:"No. Fertility depends on many factors and tests. Only a doctor can assess it after a proper evaluation.",qa2q:"Does one abnormal report mean infertility?",qa2a:"No. Results can vary and tests are often repeated. A doctor looks at the full picture.",qa3q:"Is infertility only a women’s problem?",qa3a:"No. Either partner, or both, can be involved, so evaluation usually includes both.",qa4q:"Is my health information safe?",qa4a:"In this demo, values you type stay on your device and are not sent to our servers. Please do not enter real data. See the Privacy Policy for details.",qa5q:"Can this app replace my doctor?",qa5a:"No. It gives general information only. Your doctor makes the treatment decisions.",qa6q:"When should I see a doctor?",qa6a:"Many guidelines suggest seeing a doctor after about a year of trying (about six months if the woman is over 35), or sooner if you already know of a problem.",prof:"Profile",acc:"Your account",sout:"Sign out",delt:"Delete my account",delp:"This removes your sign-in account from this app. In this demo we do not store other personal data on our servers.",delb:"Delete my account",delc:"Delete your account? This cannot be undone.",dele:"For security, please sign out, sign in again and retry.",emg:"Emergency: if you have severe pain, heavy bleeding, fainting or any urgent problem, get medical help immediately (112 in India). This app is not for emergencies.",fph:"Fertility Passport (demo)",fphp:"Your records in one place, shared only with your consent.",fpt:"Fertility Passport (demo)",fpn:"Demo with fake data only. Never enter real health data.",fpd:"One secure place for your records, shared only when you say yes.",fpr:"Your records (sample)",fpr1:"Semen analysis · 12 Oct 2026 · sample",fpr2:"Hormone panel · 28 Oct 2026 · sample",fpr3:"Ultrasound · 5 Nov 2026 · sample",fps:"Share with a doctor",fpc:"Allow Dr. Sample A to view my records for 7 days",fpoff:"Access is OFF. Nobody can see your records.",fpon:"Access is ON for Dr. Sample A (7 days).",fpx:"You can turn access off at any time. We never sell your data.",ivh:"IVF and treatment guide",ivp:"The main steps explained in simple words.",ivt:"IVF in simple steps",ivn:"General education only. This content has not yet been reviewed by a doctor and does not replace medical advice.",ivs:"Common steps (they differ for each person)",iv1:"1. Evaluation: tests for both partners and a plan from your doctor.",iv2:"2. Stimulation: hormone medicines help several eggs mature.",iv3:"3. Monitoring: ultrasounds and blood tests to track progress.",iv4:"4. Trigger and egg retrieval: a short procedure, usually with sedation.",iv5:"5. Fertilization in the lab: eggs and sperm are combined (ICSI is one method).",iv6:"6. Embryo growth: embryos are watched for a few days.",iv7:"7. Embryo transfer: one embryo is placed in the womb, fresh or frozen.",iv8:"8. Pregnancy test: a blood test after about two weeks, as your doctor advises.",ivrt:"Risks and realities",ivr:"IVF can involve side effects of medicines, rare complications, multiple pregnancy and emotional stress. Success depends on age, the cause of infertility and the clinic. Ask your doctor for figures that apply to you.",ivqt:"Questions to ask your doctor",ivq1:"What is my likely cause and w Object.assign(T.en,{"demo": "This is a friendly demo with sample data only. For real care, your doctor is your best guide.", "emg": "Your safety comes first: if you have severe pain, heavy bleeding, fainting or any urgent concern, please get medical help right away (112 in India). This app is not for emergencies.", "clo": "Concentration is a little lower than the reference range (about 16 million/ml). A fertility doctor can explain what it means and what can help.", "cok": "Concentration is within or above the reference range (about 16 million/ml). This is encouraging, though only your doctor can see the whole picture.", "mlo": "Motility is a little lower than the reference range (about 42%). Many things can influence it, and your doctor can guide the next steps.", "mok": "Motility is within or above the reference range (about 42%). This is encouraging, and your doctor will look at the full picture.", "disc": "This is general information, not a diagnosis. Results are often repeated, and a fertility doctor can explain them calmly and clearly.", "mnp": "One report never tells the whole story. Tests are often repeated, and your doctor looks at the full picture.", "est": "This is a gentle estimate. Every body is unique, so cycles can vary.", "ivn": "General education to help you prepare for conversations with your doctor. A doctor has not yet reviewed this content.", "ivrt": "What to know and how to prepare", "ivr": "Like any medical care, IVF can involve medicine side effects, rare complications, multiple pregnancy and emotional ups and downs, and support can help. Many people achieve a pregnancy with treatment, though results differ. Success depends on age, the cause and the clinic, and your doctor can share the figures that fit you.", "hwxt": "What to expect from this app", "hwx": "This app shares information so you can feel prepared. It does not diagnose, prescribe or give treatment advice, and it is not for emergencies. In this demo, please do not enter real medical data.", "qa1a": "Only a doctor can answer that after a proper evaluation, because many factors matter. This app helps you understand and prepare.", "qa2q": "Does one test result decide everything?", "qa2a": "Not at all. Results can vary and are often repeated, and your doctor looks at the full picture.", "qa3q": "Is this only a woman’s journey?", "qa3a": "Not at all. Either partner, or both, can be involved, so a check-up usually includes both. You are in this together.", "qa5q": "Does this app replace my doctor?", "qa5a": "Your doctor stays your best guide. This app offers general information so you can ask better questions.", "qa6a": "Many guidelines suggest speaking with a doctor after about a year of trying (about six months if the woman is over 35), or sooner if you already have a concern. Reaching out early is a positive step.", "fc1a": "Can cause irregular periods and affect ovulation. Many people find effective support. A doctor can confirm it and plan with you.", "fc2a": "Can cause pelvic pain and may affect fertility. If period pain is severe, a doctor can help you feel better and plan next steps.", "fc3a": "Thyroid balance can influence periods and fertility. A simple blood test ordered by your doctor can check it, and thyroid conditions are often manageable.", "h6": "Choose trusted, evidence-based care and be cautious of anyone promising guaranteed results.", "lpr": "Your health data stays yours, and we will never sell it.", "fpn": "Sample data only for now. Please do not enter real health information."});
Object.assign(T.hi,{"demo": "यह नमूना जानकारी वाला एक मित्रवत डेमो है। असली देखभाल के लिए आपका डॉक्टर सबसे अच्छा मार्गदर्शक है।", "emg": "आपकी सुरक्षा सबसे पहले: तेज़ दर्द, ज़्यादा खून आना, बेहोशी या कोई भी ज़रूरी चिंता हो तो कृपया तुरंत डॉक्टर की मदद लीजिए (भारत में 112)। यह ऐप आपातकाल के लिए नहीं है।", "clo": "Concentration संदर्भ सीमा (लगभग 16 million/ml) से थोड़ा कम है। fertility डॉक्टर बता सकते हैं कि इसका क्या मतलब है और क्या मदद कर सकता है।", "cok": "Concentration संदर्भ सीमा (लगभग 16 million/ml) के भीतर या ऊपर है। यह उत्साहजनक है, पर पूरी तस्वीर सिर्फ़ आपका डॉक्टर देख सकता है।", "mlo": "Motility संदर्भ सीमा (लगभग 42%) से थोड़ी कम है। कई बातें इसे प्रभावित कर सकती हैं, और डॉक्टर अगले कदम बता सकते हैं।", "mok": "Motility संदर्भ सीमा (लगभग 42%) के भीतर या ऊपर है। यह उत्साहजनक है, और आपका डॉक्टर पूरी तस्वीर देखेगा।", "disc": "यह सामान्य जानकारी है, निदान नहीं। नतीजे अक्सर दोबारा जाँचे जाते हैं, और fertility डॉक्टर उन्हें आराम से और साफ़ समझा सकते हैं।", "mnp": "एक रिपोर्ट पूरी कहानी नहीं बताती। जाँच अक्सर दोबारा होती है, और आपका डॉक्टर पूरी तस्वीर देखता है।", "est": "यह एक हल्का अनुमान है। हर शरीर अलग होता है, इसलिए चक्र बदल सकते हैं।", "ivn": "डॉक्टर से बातचीत की तैयारी में मदद के लिए सामान्य जानकारी। इस सामग्री की अभी किसी डॉक्टर ने समीक्षा नहीं की है।", "ivrt": "क्या जानें और कैसे तैयारी करें", "ivr": "किसी भी चिकित्सा की तरह IVF में दवाओं के दुष्प्रभाव, दुर्लभ जटिलताएँ, जुड़वाँ या अधिक बच्चों की गर्भावस्था और भावनात्मक उतार-चढ़ाव हो सकते हैं, और सहयोग से मदद मिलती है। कई लोग इलाज से गर्भधारण कर पाते हैं, हालाँकि नतीजे अलग-अलग होते हैं। सफलता उम्र, कारण और क्लिनिक पर निर्भर करती है, और आपके लिए सही आँकड़े आपका डॉक्टर बता सकता है।", "hwxt": "इस ऐप से क्या उम्मीद रखें", "hwx": "यह ऐप जानकारी देता है ताकि आप तैयार महसूस करें। यह निदान, दवा या इलाज की सलाह नहीं देता और आपातकाल के लिए नहीं है। इस डेमो में कृपया असली मेडिकल जानकारी न डालें।", "qa1a": "यह सिर्फ़ डॉक्टर ही उचित जाँच के बाद बता सकते हैं, क्योंकि कई बातें मायने रखती हैं। यह ऐप आपको समझने और तैयारी करने में मदद करता है।", "qa2q": "क्या एक जाँच का नतीजा सब कुछ तय कर देता है?", "qa2a": "बिल्कुल नहीं। नतीजे बदल सकते हैं और अक्सर दोबारा जाँचे जाते हैं, और आपका डॉक्टर पूरी तस्वीर देखता है।", "qa3q": "क्या यह सिर्फ़ महिला की यात्रा है?", "qa3a": "बिल्कुल नहीं। कोई एक साथी या दोनों शामिल हो सकते हैं, इसलिए जाँच आमतौर पर दोनों की होती है। आप इसमें साथ हैं।", "qa5q": "क्या यह ऐप मेरे डॉक्टर की जगह लेता है?", "qa5a": "आपका डॉक्टर ही आपका सबसे अच्छा मार्गदर्शक रहेगा। यह ऐप सामान्य जानकारी देता है ताकि आप बेहतर सवाल पूछ सकें।", "qa6a": "कई दिशानिर्देश कहते हैं कि लगभग एक साल कोशिश के बाद डॉक्टर से बात करें (महिला की उम्र 35 से ऊपर हो तो करीब छह महीने बाद), या कोई चिंता पहले से हो तो और जल्दी। जल्दी संपर्क करना एक सकारात्मक कदम है।", "fc1a": "माहवारी अनियमित हो सकती है और ovulation प्रभावित हो सकता है। कई लोगों को प्रभावी सहयोग मिलता है। डॉक्टर पुष्टि करके आपके साथ योजना बना सकते हैं।", "fc2a": "पेड़ू में दर्द हो सकता है और प्रजनन पर असर पड़ सकता है। माहवारी का दर्द तेज़ हो तो डॉक्टर आपको बेहतर महसूस कराने और अगले कदम तय करने में मदद कर सकते हैं।", "fc3a": "थायरॉइड का संतुलन माहवारी और प्रजनन को प्रभावित कर सकता है। डॉक्टर द्वारा बताई गई साधारण खून की जाँच से पता चलता है, और थायरॉइड की समस्याएँ अक्सर संभाली जा सकती हैं।", "h6": "भरोसेमंद, प्रमाण-आधारित देखभाल चुनिए और \"पक्के नतीजे\" का वादा करने वालों से सावधान रहिए।", "lpr": "आपका स्वास्थ्य डेटा आपका ही रहता है, और हम उसे कभी नहीं बेचेंगे।", "fpn": "अभी सिर्फ़ नमूना data है। कृपया असली स्वास्थ्य जानकारी न डालें।"});
