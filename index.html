<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0f766e">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FertiWorld AI</title>
<style>
:root{--bg:#f5f9f8;--card:#fff;--ink:#16302b;--mute:#5d7570;--brand:#0f766e;--soft:#d8efeb;--line:#d5e3e0;--warn:#fff4dc;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1a18;--card:#162623;--ink:#e6f2ef;--mute:#9bb5b0;--brand:#2dd4bf;--soft:#173b36;--line:#27413d;--warn:#3a3016}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0 auto;background:var(--bg);color:var(--ink);font-family:system-ui,"Noto Sans Devanagari","Noto Sans Arabic",sans-serif;line-height:1.55;max-width:480px;padding-bottom:84px}
header{padding:18px 18px 6px}
h1{font-size:22px;margin:0}
.sub{color:var(--mute);font-size:14px;margin:2px 0 0}
section{display:none;padding:8px 18px}
section.on{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 0}
.card h3{margin:0 0 4px;font-size:16px}
.card p{margin:0;font-size:14px;color:var(--mute)}
button{font:inherit;background:var(--brand);color:#fff;border:0;border-radius:10px;padding:10px 14px;margin-top:10px;cursor:pointer}
button.alt{background:var(--soft);color:var(--ink)}
.note{background:var(--warn);border-radius:10px;padding:10px 12px;font-size:13px;margin:10px 0}
nav{position:fixed;bottom:0;left:0;right:0;max-width:480px;margin:0 auto;display:flex;background:var(--card);border-top:1px solid var(--line);padding:6px 0 calc(6px + env(safe-area-inset-bottom,0px))}
nav button{flex:1;background:none;color:var(--mute);margin:0;padding:8px 2px;font-size:12px;border-radius:0}
nav button.on{color:var(--brand);font-weight:700}
input,select{font:inherit;width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);margin-top:6px}
.lang{margin-top:10px}
.res{margin-top:10px;font-size:14px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
</style>
</head>
<body>
<header>
<h1>FertiWorld AI</h1><p class="sub" data-t="tag"></p>
<select id="lang" class="lang" aria-label="Language" onchange="manual=true;setLang(this.value)">

</select>
<div id="fb" class="note" style="margin:8px 0 0;display:none">Translation in review · अनुवाद जाँच में है. Showing English for now.</div>

<div class="note" data-t="emg"></div>

<div class="card"><h3 data-t="hm"></h3><p data-t="hmp"></p><button class="alt" onclick="go('male')" data-t="view"></button></div>
<div class="card"><h3 data-t="hf"></h3><p data-t="hfp"></p><button class="alt" onclick="go('female')" data-t="view"></button></div>
<div class="card"><h3 data-t="hd"></h3><p data-t="hdp"></p><button class="alt" onclick="go('docs')" data-t="view"></button></div>
<div class="card"><h3 data-t="ivh"></h3><p data-t="ivp"></p><button class="alt" onclick="go('ivf')" data-t="view"></button></div>

<section id="feedback"><div class="card"><h3 data-t="fbt"></h3>

<label><span data-t="fq2"></span><textarea id="fq2" rows="4" style="width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit;margin-top:6px"></textarea></label>

<section id="passport"><div class="card"><h3 data-t="fpt"></h3><div class="note" data-t="fpn"></div><p data-t="fpd"></p></div>
<div class="card"><h3 data-t="fpr"></h3><ul style="padding-left:20px;font-size:14px;color:var(--mute);line-height:1.8"><li data-t="fpr1"></li><li data-t="fpr2"></li><li data-t="fpr3"></li></ul></div>
<div class="card"><h3 data-t="fps"></h3><label style="display:flex;gap:10px;align-items:flex-start;font-size:14px"><input id="fpcb" type="checkbox" style="width:auto;margin-top:4px" onchange="fpUpdate()"><span data-t="fpc"></span></label><p id="fpst" data-t="fpoff" style="margin-top:10px"></p><p data-t="fpx" style="margin-top:10px"></p><button class="alt" onclick="go('home')" data-t="n1"></button></div></section>

<section id="profile"><div class="card"><h3 data-t="acc"></h3><p id="pname" style="color:var(--ink);font-weight:600"></p><p id="pemail"></p><button onclick="fwSignOut()" data-t="sout"></button></div>
<div class="card"><h3 data-t="delt"></h3><p data-t="delp"></p><p id="pmsg" class="res"></p><button class="alt" onclick="fwDelete()" data-t="delb"></button> <button class="alt" onclick="go('home')" data-t="n1"></button></div></section>

<section id="report"><div class="card"><h3 data-t="rt"></h3>
<label><span data-t="rc"></span><input id="conc" type="number"></label>

<section id="male">

<div class="card"><h3 data-t="mn"></h3><p data-t="mnp"></p></div>
</section>

<section id="female"><div class="card"><h3 data-t="ft"></h3>
<label><span data-t="fl"></span><input id="lmp" type="date"></label>

<div class="card"><h3 data-t="fcm"></h3><p>PCOS · Endometriosis · Thyroid</p></div></section>
